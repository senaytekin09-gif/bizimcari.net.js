name: APK Derle

on:
  push:
    branches: [main, asistans-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Derle
        run: gradle assembleDebug --no-daemon
      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Asistans.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Asistans-apk
          path: Asistans.apk
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Asistans v1.0.${{ github.run_number }}
          files: Asistans.apk
